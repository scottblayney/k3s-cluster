apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nextcloud-aio
  namespace: nextcloud
spec:
  interval: 12h
  url: https://nextcloud.github.io/all-in-one/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud-aio
  namespace: nextcloud
spec:
  interval: 30m
  releaseName: nextcloud-aio
  chart:
    spec:
      chart: nextcloud-aio-helm-chart
      version: "13.6.0"
      sourceRef:
        kind: HelmRepository
        name: nextcloud-aio
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: nextcloud-aio-values
      valuesKey: values.yaml
  postRenderers:
    - kustomize:
        patches:
          # Ubuntu 26.04 stacks AppArmor profiles for containers, and the default
          # containerd profile then denies SIGURG between processes of the same
          # container. Postgres uses SIGURG for latch wakeups, so crash recovery
          # hangs forever. The chart exposes no securityContext values, hence the
          # patch. The startup probe covers slow crash recovery after restarts.
          - target:
              kind: Deployment
              name: nextcloud-aio-database
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: nextcloud-aio-database
              spec:
                template:
                  spec:
                    containers:
                      - name: nextcloud-aio-database
                        securityContext:
                          appArmorProfile:
                            type: Unconfined
                        startupProbe:
                          exec:
                            command:
                              - /healthcheck.sh
                          periodSeconds: 30
                          timeoutSeconds: 30
                          failureThreshold: 60
  values:
    # TODO! This needs to be a unique and good password!
    # TODO! Needs to be changed to the domain that you want to use for Nextcloud.
    NC_DOMAIN: nextcloud.blayney.org
    # TODO! This is the timezone that your containers will use.
    TIMEZONE: America/Vancouver
    # Setting this to "yes" (with quotes) enables the option in Nextcloud automatically.
    CLAMAV_ENABLED: "no"
    # Setting this to "yes" (with quotes) enables the option in Nextcloud automatically.
    COLLABORA_ENABLED: "no"
    # Setting this to "yes" (with quotes) enables the option in Nextcloud automatically.
    EUROOFFICE_ENABLED: "no"
    # Setting this to "yes" (with quotes) enables the option in Nextcloud automatically.
    FULLTEXTSEARCH_ENABLED: "no"
    # Setting this to "yes" (with quotes) enables the option in Nextcloud automatically.
    HARP_ENABLED: "no"
    # Setting this to "yes" (with quotes) enables the option in Nextcloud automatically.
    IMAGINARY_ENABLED: "no"
    # Setting this to "yes" (with quotes) enables the option in Nextcloud automatically.
    ONLYOFFICE_ENABLED: "no"
    # Setting this to "yes" (with quotes) enables the option in Nextcloud automatically.
    TALK_ENABLED: "no"
    # Setting this to "yes" (with quotes) enables the option in Nextcloud automatically.
    TALK_RECORDING_ENABLED: "no"
    # Setting this to "yes" (with quotes) enables the option in Nextcloud automatically.
    WHITEBOARD_ENABLED: "no"
    # Allows to adjust the global AIO log level. Valid values are debug, info, warn and error.
    AIO_LOG_LEVEL: warn
    # This needs to be an integer and in sync with NEXTCLOUD_UPLOAD_LIMIT
    APACHE_MAX_SIZE: "1073741824"
    # Changing this to a different value than 443 will allow you to run it behind a web server or reverse proxy (like Apache, Nginx, Caddy, Cloudflare Tunnel and else).
    APACHE_PORT: 11443
    ADDITIONAL_COLLABORA_OPTIONS:
      # You can add additional collabora options here by using the array syntax.
      - --o:security.seccomp=true
    # You can change this in order to enable other dictionaries for collabora
    COLLABORA_DICTIONARIES: de_DE en_GB en_US es_ES fr_FR it nl pt_BR pt_PT ru
    # Allows to adjust the fulltextsearch java options.
    FULLTEXTSEARCH_JAVA_OPTIONS: -Xms512M -Xmx512M
    # Setting this to "yes" will install the latest Major Nextcloud version upon the first installation
    INSTALL_LATEST_MAJOR: "no"
    # This allows to add additional packages to the Nextcloud container permanently. Default is imagemagick but can be overwritten by modifying this value.
    NEXTCLOUD_ADDITIONAL_APKS: imagemagick
    # This allows to add additional php extensions to the Nextcloud container permanently. Default is imagick but can be overwritten by modifying this value.
    NEXTCLOUD_ADDITIONAL_PHP_EXTENSIONS: imagick
    # This allows to change the upload time limit of the Nextcloud container
    NEXTCLOUD_MAX_TIME: 3600
    # This allows to change the PHP memory limit of the Nextcloud container
    NEXTCLOUD_MEMORY_LIMIT: 512M
    # Allows to modify the Nextcloud apps that are installed on starting AIO the first time. You can also disable apps by using a hyphen in front of them. E.g. -app_api
    NEXTCLOUD_STARTUP_APPS: deck twofactor_totp tasks calendar contacts notes
    # Setting this to any value allows to automatically import root certificates into the Nextcloud container
    NEXTCLOUD_TRUSTED_CACERTS_DIR: null
    # This allows to change the upload limit of the Nextcloud container
    NEXTCLOUD_UPLOAD_LIMIT: 1G
    # Setting this to "no" keep Nextcloud apps that are disabled via their switch and not uninstall them if they should be installed in Nextcloud.
    REMOVE_DISABLED_APPS: "yes"
    # This allows to adjust the port that the talk container is using. It should be set to something higher than 1024! Otherwise it might not work!
    TALK_PORT: 3478
    # When setting to "yes" (with quotes), it will automatically update all installed Nextcloud apps upon container startup on saturdays.
    UPDATE_NEXTCLOUD_APPS: "no"
    # By setting this, you can adjust the storage class for your volumes. This should be a fast storage like SSD backed storage! This storage class must provide RWX and RWO volumes (ReadWriteMany and ReadWriteOnce).
    STORAGE_CLASS: rook-cephfs
    # Allows to set a dedicated storage class for the Nextcloud data volume. This can be a bit slower storage than the one above. This storage class must provide RWX volumes (ReadWriteMany). ⚠️ Warning: only set this for new installations, not existing ones!
    STORAGE_CLASS_DATA: rook-cephfs
    # You can change the size of the apache volume that default to 1Gi with this value
    APACHE_STORAGE_SIZE: 1Gi
    # You can change the size of the clamav volume that default to 1Gi with this value
    CLAMAV_STORAGE_SIZE: 1Gi
    # You can change the size of the database volume that default to 1Gi with this value
    DATABASE_STORAGE_SIZE: 1Gi
    # You can change the size of the database-dump volume that default to 1Gi with this value
    DATABASE_DUMP_STORAGE_SIZE: 1Gi
    # You can change the size of the elasticsearch volume that default to 1Gi with this value
    ELASTICSEARCH_STORAGE_SIZE: 1Gi
    # You can change the size of the eurooffice volume that default to 1Gi with this value
    EUROOFFICE_STORAGE_SIZE: 1Gi
    # You can change the size of the eurooffice-data volume that default to 1Gi with this value
    EUROOFFICE_DATA_STORAGE_SIZE: 1Gi
    # You can change the size of the harp volume that default to 1Gi with this value
    HARP_STORAGE_SIZE: 1Gi
    # You can change the size of the nextcloud volume that default to 1Gi with this value
    NEXTCLOUD_STORAGE_SIZE: 5Gi
    # You can change the size of the nextcloud-data volume that default to 1Gi with this value
    NEXTCLOUD_DATA_STORAGE_SIZE: 5Gi
    # You can change the size of the nextcloud-trusted-cacerts volume that default to 1Gi with this value
    NEXTCLOUD_TRUSTED_CACERTS_STORAGE_SIZE: 1Gi
    # You can change the size of the onlyoffice volume that default to 1Gi with this value
    ONLYOFFICE_STORAGE_SIZE: 1Gi
    # You can change the size of the redis volume that default to 1Gi with this value
    REDIS_STORAGE_SIZE: 1Gi
    # You can change the size of the talk-recording volume that default to 1Gi with this value
    TALK_RECORDING_STORAGE_SIZE: 1Gi
    # By changing this, you can adjust the namespace of the installation which allows to install multiple instances on one kubernetes cluster
    NAMESPACE: nextcloud
    # By setting this to "yes", you can disabled the creation of the namespace so that you can use a pre-created one
    NAMESPACE_DISABLED: "no"
    # By setting this to "yes", you can enable a network policy that limits network access to the same namespace. Except the Web server service which is reachable from all endpoints.
    NETWORK_POLICY_ENABLED: "no"
    # This allows to configure allowed apps that will be shown in Nextcloud's Appstore. You need to enter the app-IDs of the apps here and separate them with spaces. E.g. 'files richdocuments'
    APPS_ALLOWLIST: null
    # Allows to add one additional ip-address to Nextcloud's trusted proxies and to the Office WOPI-allowlist automatically. Set it e.g. like this: 'your.public.ip-address'. You can also use an ip-range here.
    ADDITIONAL_TRUSTED_PROXY: null
    # Allows to add one domain to Nextcloud's trusted domains and also generates a certificate automatically for it
    ADDITIONAL_TRUSTED_DOMAIN: null
    # Allows to adjust the default quota that will be taken into account in Nextcloud for new users. Setting it to "unlimited" will set it to unlimited
    NEXTCLOUD_DEFAULT_QUOTA: 10 GB
    # Allows to adjust the sekeleton dir for Nextcloud. Setting it to "empty" will set the value to an empty string "" which will turn off the setting for new users in Nextcloud.
    NEXTCLOUD_SKELETON_DIRECTORY: null
    # Allows to define the maintenance window for Nextcloud. See https://docs.nextcloud.com/server/stable/admin_manual/configuration_server/background_jobs_configuration.html#parameters for possible values
    NEXTCLOUD_MAINTENANCE_WINDOW: null
    # (empty by default): The hostname of the SMTP server.
    SMTP_HOST: null
    # (empty by default): Set to 'ssl' to use SSL, or 'tls' to use STARTTLS.
    SMTP_SECURE: null
    # (default: '465' for SSL and '25' for non-secure connections): Optional port for the SMTP connection. Use '587' for an alternative port for STARTTLS.
    SMTP_PORT: null
    # (default: 'LOGIN'): The method used for authentication. Use 'PLAIN' if no authentication or STARTLS is required.
    SMTP_AUTHTYPE: null
    # (empty by default): The username for the authentication.
    SMTP_NAME: null
    # (not set by default): Set the local-part for the 'from' field in the emails sent by Nextcloud.
    MAIL_FROM_ADDRESS: null
    # (not set by default): Set a different domain for the emails than the domain where Nextcloud is installed.
    MAIL_DOMAIN: null
    # This allows to adjust the max stream bitrate of the talk hpb
    TALK_MAX_STREAM_BITRATE: "1048576"
    # This allows to adjust the max stream bitrate of the talk hpb
    TALK_MAX_SCREEN_BITRATE: "2097152"
    # HP_SHARED_KEY:           # This allows to set the shared key for HaRP which is getting set at the very top of this values.yaml file.
    # The storage class that HaRP uses for ExApp persistent volume claims. Leave empty to use the cluster's default storage class.
    HARP_K8S_STORAGE_CLASS: null
    # The default size of the persistent volume claims that HaRP creates for ExApps.
    HARP_K8S_DEFAULT_STORAGE_SIZE: 10Gi
    # Optional. Additional host aliases that HaRP sets on the ExApp pods so that they can resolve the configured hostnames. Use a comma-separated list of hostname:ip pairs, e.g. 'nextcloud.example.com:10.0.0.5,collabora.example.com:10.0.0.6'. Leave empty to not set any host aliases.
    HARP_K8S_HOST_ALIASES: null
    # The name of the Kubernetes service account that is mounted into the HaRP pod and used to authenticate against the Kubernetes API. It must exist in the same namespace in which HaRP runs (see NAMESPACE) and you need to create it yourself and grant it permission to manage resources (deployments, services, persistent volume claims, …) in that namespace via a Role/RoleBinding. Leave empty to use the namespace's "default" service account.
    HARP_SERVICE_ACCOUNT_NAME: null
