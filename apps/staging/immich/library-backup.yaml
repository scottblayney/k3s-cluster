apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-library-backup
  namespace: immich
spec:
  # 11:00 UTC = 04:00 Pacific (PDT); after Immich's DB dump and the CNPG backup
  schedule: "0 11 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: restic
              image: restic/restic:0.19.1
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  restic unlock
                  restic backup /data --host immich --tag library \
                    --exclude /data/thumbs --exclude /data/encoded-video
                  restic forget --host immich --tag library --prune \
                    --keep-daily 7 --keep-weekly 4 --keep-monthly 6
                  restic check
              envFrom:
                - secretRef:
                    name: immich-library-backup
              env:
                - name: RESTIC_CACHE_DIR
                  value: /cache
              volumeMounts:
                - name: library
                  mountPath: /data
                  readOnly: true
                - name: cache
                  mountPath: /cache
          volumes:
            - name: library
              persistentVolumeClaim:
                claimName: immich-library-pvc
                readOnly: true
            - name: cache
              emptyDir: {}
